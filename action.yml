name: Game Automated SemVer
description: "Bump or set a Godot, Node.js, Unity, or Unreal project version through the corresponding BigfootDS updater package."
branding:
  icon: git-commit
  color: purple

inputs:
  engine:
    description: "Project type to update: auto, godot, nodejs, unity, or unreal."
    required: false
    default: auto
  working-directory:
    description: "Directory containing the game project."
    required: false
    default: .
  project-path:
    description: "Path to the version file, relative to working-directory. Auto-detected when omitted."
    required: false
  version:
    description: "Exact version to write. Takes precedence over bump."
    required: false
  version-format:
    description: "Literal template for a primary display version, such as v{major}.{minor}.{patch}-demo."
    required: false
  bump:
    description: "Version component to increment: major, minor, patch, quad (Unity only), or none."
    required: false
    default: patch
  release-label:
    description: "Semantic-version prerelease label to apply, such as rc.1."
    required: false
  build-label:
    description: "Semantic-version build label to apply, such as build.42."
    required: false
  strip-leading-v:
    description: "Remove one leading v from the version input."
    required: false
    default: "false"
  allow-non-semver:
    description: "Allow an exact Godot, Node.js, or Unreal version input that is not strict SemVer."
    required: false
    default: "false"
  dry-run:
    description: "Calculate the update without writing the project file."
    required: false
    default: "false"
  unreal-section:
    description: "Unreal INI section containing the version."
    required: false
    default: /Script/EngineSettings.GeneralProjectSettings
  unreal-key:
    description: "Unreal INI key containing the version."
    required: false
    default: ProjectVersion
  unity-version-properties:
    description: "JSON object mapping supported Unity PlayerSettings properties to version format strings."
    required: false
    default: '{"bundleVersion":"{major}.{minor}.{patch}"}'
  unity-quad:
    description: "Optional non-negative fourth version component for Unity output formats."
    required: false
  unity-treat-build-as-patch:
    description: "Keep Unity build and patch numeric values coupled."
    required: false
    default: "true"
  unity-treat-revision-as-quad:
    description: "Keep Unity revision and quad numeric values coupled."
    required: false
    default: "true"
  nodejs-version-properties:
    description: "JSON array of Node.js JSON version properties with filePath, jsonPointer, optional format, and optional create fields."
    required: false
    default: "[]"
  nodejs-version-source:
    description: "Optional JSON object identifying the formatted Node.js display version used as the bump source."
    required: false

outputs:
  version:
    description: "Version written or calculated by the action."
  previous-version:
    description: "Version found before the action ran, if any."
  changed:
    description: "Whether the action changed (or would change) the project file."
  engine:
    description: "Resolved game engine."
  project-path:
    description: "Resolved path to the updated settings file."
  full-data:
    description: "JSON describing the resolved version and engine-specific output data."

runs:
  using: node24
  main: dist/index.js
